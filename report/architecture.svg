<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .box{fill:#f4f7f9;stroke:#3b4b57;stroke-width:1.3;rx:8}
      .llm{fill:#fff5e0;stroke:#b07b18}
      .data{fill:#e8f6f2;stroke:#2a7d6b}
      .guard{fill:#fdecea;stroke:#b5473a}
      .t{font-weight:600}
      .s{font-size:11px;fill:#445}
      line,path.e{stroke:#444;stroke-width:1.3;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <!-- client / api -->
  <rect class="box" x="20" y="170" width="120" height="60"/>
  <text class="t" x="80" y="195" text-anchor="middle">Browser UI</text>
  <text class="s" x="80" y="213" text-anchor="middle">web/ (SSE over fetch)</text>
  <rect class="box" x="180" y="170" width="130" height="60"/>
  <text class="t" x="245" y="195" text-anchor="middle">FastAPI</text>
  <text class="s" x="245" y="213" text-anchor="middle">/api/ask · /api/search</text>
  <line x1="140" y1="192" x2="178" y2="192"/>
  <line x1="180" y1="210" x2="142" y2="210"/>
  <text class="s" x="160" y="245" text-anchor="middle">SSE events</text>

  <!-- agent + rag -->
  <rect class="box" x="355" y="95" width="150" height="70"/>
  <text class="t" x="430" y="120" text-anchor="middle">Agent loop</text>
  <text class="s" x="430" y="137" text-anchor="middle">max 6 steps, stop on</text>
  <text class="s" x="430" y="151" text-anchor="middle">answer / repeat / invalid</text>
  <rect class="box" x="355" y="265" width="150" height="55"/>
  <text class="t" x="430" y="288" text-anchor="middle">Quick RAG</text>
  <text class="s" x="430" y="305" text-anchor="middle">retrieve → cite → stream</text>
  <path class="e" d="M310,190 C330,190 330,130 353,130"/>
  <path class="e" d="M310,212 C330,212 330,292 353,292"/>

  <!-- validation -->
  <rect class="box guard" x="545" y="20" width="160" height="60"/>
  <text class="t" x="625" y="44" text-anchor="middle">Pydantic validate</text>
  <text class="s" x="625" y="62" text-anchor="middle">+ repair (tool allow-list)</text>
  <path class="e" d="M470,95 C480,60 510,50 543,50"/>
  <rect class="box" x="545" y="110" width="160" height="50"/>
  <text class="t" x="625" y="132" text-anchor="middle">ToolBox</text>
  <text class="s" x="625" y="149" text-anchor="middle">clip + frame results as data</text>
  <line x1="625" y1="80" x2="625" y2="108"/>
  <line x1="545" y1="140" x2="507" y2="140"/>

  <!-- tools -->
  <rect class="box" x="745" y="95" width="135" height="34"/>
  <text x="812" y="117" text-anchor="middle">search_docs</text>
  <rect class="box guard" x="745" y="140" width="135" height="34"/>
  <text x="812" y="162" text-anchor="middle">run_sql (guarded)</text>
  <rect class="box" x="745" y="185" width="135" height="34"/>
  <text x="812" y="207" text-anchor="middle">calculator (AST)</text>
  <path class="e" d="M705,130 L743,112"/>
  <path class="e" d="M705,140 L743,157"/>
  <path class="e" d="M705,150 L743,200"/>

  <!-- retriever -->
  <rect class="box" x="560" y="250" width="180" height="70"/>
  <text class="t" x="650" y="273" text-anchor="middle">Retriever</text>
  <text class="s" x="650" y="290" text-anchor="middle">BM25 (default) or hybrid RRF</text>
  <text class="s" x="650" y="305" text-anchor="middle">min_score floor → refuse</text>
  <path class="e" d="M752,129 C722,180 728,215 712,248"/>
  <line x1="505" y1="292" x2="558" y2="288"/>

  <!-- data -->
  <rect class="box data" x="545" y="355" width="210" height="55"/>
  <text class="t" x="650" y="378" text-anchor="middle">Chunks + embedding cache</text>
  <text class="s" x="650" y="395" text-anchor="middle">77 Wikipedia articles, section chunks</text>
  <line x1="650" y1="320" x2="650" y2="353"/>
  <rect class="box data" x="775" y="355" width="115" height="55"/>
  <text class="t" x="832" y="378" text-anchor="middle">SQLite</text>
  <text class="s" x="832" y="395" text-anchor="middle">read-only + authorizer</text>
  <path class="e" d="M880,174 C895,260 870,320 845,353"/>

  <!-- llm -->
  <rect class="box llm" x="300" y="355" width="200" height="55"/>
  <text class="t" x="400" y="378" text-anchor="middle">Class LiteLLM proxy</text>
  <text class="s" x="400" y="395" text-anchor="middle">gemma-4-E4B-it · bge-m3 (T=0)</text>
  <line x1="430" y1="320" x2="420" y2="353"/>
  <path class="e" d="M370,165 C330,250 330,330 350,353"/>
  <path class="e" d="M560,315 C530,340 520,370 502,378"/>
</svg>
